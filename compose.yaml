services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in .env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in .env}
      ALLOWED_SUBJECT: ${ALLOWED_SUBJECT:?Set Laura's Pocket ID subject in .env}
      DATABASE_PATH: /data/laura.sqlite
    volumes:
      - laura-data:/data
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
volumes:
  laura-data:
